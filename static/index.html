<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple CRUD</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Simple CRUD App</h1>

      <form id="itemForm">
        <input type="hidden" id="itemId" />
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Enter item name" required />
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" rows="3" placeholder="Enter description" required></textarea>
        </div>

        <div class="buttons">
          <button type="submit" id="saveBtn">Add Item</button>
          <button type="button" id="cancelBtn" class="secondary hidden">Cancel</button>
        </div>
      </form>

      <h2>Items</h2>
      <div id="itemsList" class="items-list"></div>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
